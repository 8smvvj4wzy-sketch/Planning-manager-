name: Publier sur GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un groupe PAR BRANCHE, pas un groupe global. Avec `group: pages`, n'importe
# quel push annulait le run en cours de n'importe quelle autre branche : merger
# sur main tuait le vérificateur d'une branche de travail, qui ressortait
# « cancelled » — ni vert ni rouge, et illisible. La propriété dont Pages a
# besoin est que les déploiements de main ne se doublent pas entre eux ; elle
# est conservée, puisque les runs de main partagent la même `github.ref`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le vérificateur passe AVANT le build, et la publication en dépend : un
  # contrôle rouge n'atteint pas l'établissement. Même ordre que DatABA Manager.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: ./verifier.sh

  # Les tests d'interface pilotent un navigateur : hors de verifier.sh (qui doit
  # rester court), mais `build` en dépend quand même — une spec rouge arrête la
  # publication, au même titre qu'un contrôle du vérificateur rouge.
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # La clé porte la VERSION de Playwright : un cache indexé sur autre chose
      # servirait un navigateur incompatible après une montée de version, et
      # l'erreur serait illisible.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` reste utile même sur cache touché : les dépendances
      # système ne sont pas ce que le cache ci-dessus couvre.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:interface
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-interface
          path: playwright-report/

  build:
    needs: [verifier, interface]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:interface
      # `enablement: true` : GitHub Pages n'est activé pour aucun dépôt tant que
      # personne — humain ou action — ne l'a fait une première fois. Sans ce
      # paramètre, configure-pages échoue sur un dépôt qui n'a jamais eu Pages
      # activé (« Get Pages site failed... Not Found »), et le job deploy est
      # sauté en conséquence — c'est ce qui s'est produit ici. Le jeton du
      # workflow (permissions.pages: write, ci-dessus) suffit à l'activer via
      # l'API sans passer par Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Seule `main` publie. L'environnement `github-pages` refuse de toute façon
    # un déploiement venu d'une autre branche (« Branch is not allowed to deploy
    # to github-pages due to environment protection rules ») : sans ce garde-fou,
    # chaque branche de travail affichait un contrôle rouge qui ne voulait rien
    # dire — et un rouge permanent finit par se lire comme du bruit, y compris
    # le jour où il est vrai. Le vérificateur et le build, eux, tournent bien
    # sur toutes les branches : c'est là qu'est le vrai signal.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
